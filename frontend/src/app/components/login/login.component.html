<div class="login-container">
  <div class="background-overlay"></div>

  <div class="login-card animate-fadeIn">
    <div class="login-header">
      <div class="brand-logo">
        <img src="assets/images/logoetsi-removebg-preview.png" alt="ETSI Logo">
      </div>
      <h1>Iniciar Sesión</h1>
      <p>Accede a la plataforma de Teoría de Circuitos</p>
    </div>

    <form (ngSubmit)="login()" #loginForm="ngForm">
      <div class="form-group">
        <label for="uvus">Usuario (UVUS)</label>
        <div class="input-wrapper">
          <i class="bi bi-person-circle"></i>
          <input 
            type="text" 
            id="uvus" 
            [(ngModel)]="uvus" 
            name="uvus" 
            placeholder="Introduce tu UVUS"
            required
            autocomplete="username"
          >
        </div>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="input-wrapper">
          <i class="bi bi-shield-lock"></i>
          <input 
            type="password" 
            id="password" 
            [(ngModel)]="password" 
            name="password" 
            placeholder="••••••••"
            required
            autocomplete="current-password"
          >
        </div>
      </div>

      @if (error) {
        <div class="error-bubble">
          <i class="bi bi-exclamation-triangle-fill"></i>
          <span>{{ error }}</span>
        </div>
      }

      <button type="submit" class="btn-login" [disabled]="cargando || !loginForm.form.valid">
        @if (cargando) {
          <span class="spinner"></span>
          <span>Procesando...</span>
        } @else {
          <span>Entrar ahora</span>
          <i class="bi bi-arrow-right-short"></i>
        }
      </button>
    </form>

    <div class="registro-link">
      <span>¿Nuevo en la ETSI?</span>
      <a [routerLink]="['/registro']">Crea tu cuenta</a>
    </div>
  </div>
</div>
