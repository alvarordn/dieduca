@if (circuitData) {
  <div class="circuit-wrapper animate-fadeIn">
    <!-- Badge decorativo superior -->
    <div class="circuit-badge">
      <i class="bi bi-cpu-fill"></i> ESQUEMA TÉCNICO PRO
    </div>

    <div class="circuit-glass-card">
      <div class="svg-container">
        <svg
          [attr.viewBox]="
            '-100 -100 ' + (imgWidth + 200) + ' ' + (imgHeight + 200)
          "
          preserveAspectRatio="xMidYMid meet"
          class="circuit-svg"
        >
          <!-- CAPA 1: CABLES -->
          <g class="layer-wires">
            @for (comp of componentes; track comp.id) {
              @let source = getNode(comp.source);
              @let target = getNode(comp.target);
              @if (source && target) {
                <line
                  [attr.x1]="getNodeX(source.col)"
                  [attr.y1]="getNodeY(source.row)"
                  [attr.x2]="getNodeX(target.col)"
                  [attr.y2]="getNodeY(target.row)"
                  class="wire-line"
                />
              }
            }
          </g>

          <!-- CAPA 2: COMPONENTES -->
          <g class="layer-components">
            @for (comp of componentes; track comp.id) {
              @let mid = getComponentMidPoint(comp);
              <circle [attr.cx]="mid.x" [attr.cy]="mid.y" r="35" fill="white" />

              <image
                [attr.xlink:href]="getComponentImgPath(comp.type)"
                [attr.x]="mid.x - 50"
                [attr.y]="mid.y - 50"
                width="100"
                height="100"
                [attr.transform]="
                  'rotate(' +
                  getComponentRotation(comp) +
                  ' ' +
                  mid.x +
                  ' ' +
                  mid.y +
                  ')'
                "
              />
            }
          </g>

          <!-- CAPA 3: ETIQUETAS CON ESTILOS PERSONALIZADOS -->
          <g class="layer-labels">
            @for (comp of componentes; track comp.id) {
              @let mid = getComponentMidPoint(comp);
              @let isH = comp.orientation === "horizontal";

              <!-- Posicionamiento -->
              @let isBottom = mid.y > imgHeight / 2;
         

              
              @let etiqueta =
                comp.value
                  ? comp.id.toUpperCase() +
                    " = " +
                    formatearEtiqueta(comp.value)
                  : comp.id.toUpperCase();

              <text
                [attr.x]="isBottom || isH ? mid.x : mid.x - 55"
                [attr.y]="isBottom ? mid.y + 75 : isH ? mid.y - 75 : mid.y + 6"
                [attr.text-anchor]="isBottom || isH ? 'middle' : 'end'"
              >
                {{ etiqueta }}
              </text>
            }
          </g>

          <!-- CAPA 4: NODOS Y TIERRA -->
          <g class="layer-nodes">
            @for (nodo of nodos; track nodo.id) {
              @if (nodo.id === "N00") {
                <image
                  xlink:href="assets/components/ground.png"
                  [attr.x]="getNodeX(nodo.col) - 25"
                  [attr.y]="getNodeY(nodo.row) + 20"
                  width="50"
                  height="50"
                /> 
              }
              <image
                [attr.xlink:href]="getNodeImgPath(nodo.type)"
                [attr.x]="getNodeX(nodo.col) - 50"
                [attr.y]="getNodeY(nodo.row) - 45"
                width="100"
                height="91"
              />
            }
          </g>
        </svg>
      </div>
    </div>
  </div>
}
