<div class="container mt-5">
  <div class="row mb-4 align-items-center">
    <div class="col-md-8">
      <h2 class="text-primary fw-bold">Bloque 4: Análisis de Nudos y Mallas</h2>
    </div>
    <div class="col-md-4">
      <select class="form-select form-select-lg" [disabled]="cargando" (change)="onCambiarProblema($any($event.target).value)">
        @for (i of [1,2,3,4,5,6,7,8,9]; track i) {
          <option [value]="i">Problema {{i}}</option>
        }
      </select>
    </div>
  </div>

  @if (cargando) {
    <div class="text-center my-5">
      <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;"></div>
    </div>
  } @else if (circuitData) {
    <div class="row">
      <div class="col-lg-8 mb-4">
        <div class="card h-100 shadow border-0">
          <div class="card-body p-4 d-flex justify-content-center align-items-center">
            <app-circuit4-view [circuitData]="circuitData"></app-circuit4-view>
          </div>
        </div>
      </div>

      <div class="col-lg-4 mb-4">
        <div class="card h-100 shadow border-0">
          <div class="card-body p-4">
            <div class="alert alert-warning mb-4 shadow-sm border-0">
              <h6 class="fw-bold mb-2 text-uppercase">Enunciado</h6>
              <p class="small text-muted mb-2">{{ circuitData.preguntas.enunciado_general }}</p>
              <div class="fw-bold text-primary border-top pt-2 mt-2">{{ circuitData.preguntas.datos_enunciado }}</div>
            </div>

            <div class="mb-4">
              <label class="form-label fw-bold">{{ circuitData.preguntas.label }}</label>
              <div class="input-group input-group-lg">
                <input type="number" class="form-control" placeholder="0.00">
                <span class="input-group-text fw-bold text-white bg-primary">{{ circuitData.preguntas.unidad }}</span>
              </div>
            </div>

            <div class="d-grid">
              <button class="btn btn-success btn-lg shadow-sm">Corregir Ejercicio</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  }
</div>
