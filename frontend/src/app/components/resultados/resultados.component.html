<div class="container py-5">
  <header class="mb-5">
    <h1 class="display-5 fw-bold text-dark">Tu Progreso Técnico</h1>
    <p class="text-muted">Análisis detallado de tus aciertos en Circuitos Eléctricos</p>
  </header>

  <div class="row g-4 mb-5">
    <div class="col-md-4">
      <div class="card card-stats shadow-sm border-0 h-100">
        <div class="card-body d-flex align-items-center">
          <div class="icon-shape bg-primary-subtle text-primary me-3">
            <i class="bi bi-journal-text fs-4"></i>
          </div>
          <div>
            <h6 class="text-muted mb-0">Total Preguntas</h6>
            <span class="h4 fw-bold">45</span>
          </div>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card card-stats shadow-sm border-0 h-100 border-start border-success border-4">
        <div class="card-body d-flex align-items-center">
          <div class="icon-shape bg-success-subtle text-success me-3">
            <i class="bi bi-check-circle-fill fs-4"></i>
          </div>
          <div>
            <h6 class="text-muted mb-0">Correctas</h6>
            <span class="h4 fw-bold text-success">38</span>
          </div>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card card-stats shadow-sm border-0 h-100 border-start border-danger border-4">
        <div class="card-body d-flex align-items-center">
          <div class="icon-shape bg-danger-subtle text-danger me-3">
            <i class="bi bi-x-circle-fill fs-4"></i>
          </div>
          <div>
            <h6 class="text-muted mb-0">Incorrectas</h6>
            <span class="h4 fw-bold text-danger">7</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="card shadow-sm border-0 overflow-hidden">
    <div class="card-header bg-white py-3">
      <h5 class="mb-0 fw-bold">Rendimiento por Bloque Temático</h5>
    </div>
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="bg-light">
          <tr>
            <th class="ps-4">Bloque</th>
            <th>Progreso</th>
            <th class="text-center">Éxito (%)</th>
            <th class="text-center">Estado</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td class="ps-4">
              <div class="fw-bold text-dark">Bloque 1</div>
              <small class="text-muted">Leyes de Kirchhoff</small>
            </td>
            <td>
              <div class="progress" style="height: 8px; width: 200px;">
                <div class="progress-bar bg-success" role="progressbar" style="width: 90%"></div>
              </div>
            </td>
            <td class="text-center fw-bold">90%</td>
            <td class="text-center">
              <span class="badge bg-success-subtle text-success px-3 py-2 rounded-pill">
                <i class="bi bi-trophy-fill me-1"></i> Dominado
              </span>
            </td>
          </tr>
          <tr>
            <td class="ps-4">
              <div class="fw-bold text-dark">Bloque 2</div>
              <small class="text-muted">Elementos de Circuitos</small>
            </td>
            <td>
              <div class="progress" style="height: 8px; width: 200px;">
                <div class="progress-bar bg-warning" role="progressbar" style="width: 45%"></div>
              </div>
            </td>
            <td class="text-center fw-bold">45%</td>
            <td class="text-center">
              <span class="badge bg-warning-subtle text-warning px-3 py-2 rounded-pill">
                <i class="bi bi-clock-history me-1"></i> En proceso
              </span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
