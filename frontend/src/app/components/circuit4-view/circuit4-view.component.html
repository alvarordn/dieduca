@if (circuitData) {

<div class="circuit-container">

  <svg
    [attr.viewBox]="'-50 -50 ' + (imgWidth + 100) + ' ' + (imgHeight + 100)"
    preserveAspectRatio="xMidYMid meet"
    class="circuit-svg"
  >

    <!-- WIRES -->
    <g>
      @for (comp of componentes; track comp.id) {
        @let source = getNode(comp.source);
        @let target = getNode(comp.target);

        @if (source && target) {
          <line
            [attr.x1]="getNodeX(source.col)"
            [attr.y1]="getNodeY(source.row)"
            [attr.x2]="getNodeX(target.col)"
            [attr.y2]="getNodeY(target.row)"
            stroke="#2c3e50"
            stroke-width="5"
          />
        }
      }
    </g>

    <!-- COMPONENTS -->
    <g>
      @for (comp of componentes; track comp.id) {
        @if (comp.type !== 'wire') {

          @let mid = getComponentMidPoint(comp);

          <circle
            [attr.cx]="mid.x"
            [attr.cy]="mid.y"
            r="40"
            fill="white"
          />

          <image
            [attr.href]="getComponentImgPath(comp.type)"
            [attr.x]="mid.x - 50"
            [attr.y]="mid.y - 50"
            width="100"
            height="100"
            [attr.transform]="'rotate(' + getComponentRotation(comp) + ' ' + mid.x + ' ' + mid.y + ')'"
          />
        }
      }
    </g>

    <!-- LABELS -->
    <g>
      @for (comp of componentes; track comp.id) {
        @if (comp.type !== 'wire') {

          @let pos = getLabelPosition(comp);

          <text
            [attr.x]="pos.x"
            [attr.y]="pos.y"
            text-anchor="middle"
            font-size="20"
            fill="#1e293b"
            font-weight="bold"
          >
            {{ comp.id }}
          </text>
        }
      }
    </g>

  </svg>
</div>

}
