
<!-- Solo renderizamos todo si hay datos disponibles -->
@if (data) {

<div class="circuit-wrapper animate-fadeIn">

  <!-- Badge superior del tipo de circuito -->
  <div class="circuit-badge">
    Circuito Trifásico
  </div>

  <!-- Card principal donde se dibuja el circuito -->
  <div class="circuit-glass-card">

    <!-- Header con parámetros del circuito -->
    <div class="header">
      <p>f={{ params?.freq }} Hz | V={{ params?.v_line }} V</p>
    </div>

    <!-- Contenedor del SVG -->
    <div class="svg-container">

      <!-- SVG principal del circuito -->
      <svg class="circuit-svg" viewBox="0 0 1500 500">

        <!-- ================= FASES ================= -->
        @for (fase of fases; track fase) {

          <!-- Línea principal de cada fase -->
          <line
            x1="50"
            [attr.x2]="getEndX()"
            [attr.y1]="FaseY[fase]"
            [attr.y2]="FaseY[fase]"
            [attr.stroke]="getColor(fase)"
            stroke-width="10"
            stroke-linecap="round"
          />

          <!-- Etiqueta de cada fase (A, B, C) -->
          <text
            x="10"
            [attr.y]="FaseY[fase] + 8"
            [attr.fill]="getColor(fase)"
            font-size="32"
            font-weight="bold"
          >
            {{ fase }}
          </text>

        }

        <!-- ================= SECCIONES DEL CIRCUITO ================= -->
        @for (s of sections; track s.idx) {

          <!-- ====== SECCIÓN EN SERIE ====== -->
          @if (s.visual === 'series') {

            <!-- Se dibuja en cada fase -->
            @for (fase of fases; track fase) {

              <!-- Caja de componente -->
              <rect
                [attr.x]="getSectionX(s.idx) - 55"
                [attr.y]="FaseY[fase] - 32"
                width="110"
                height="64"
                rx="12"
                ry="12"
                fill="#ffffff"
                stroke="#1e293b"
                stroke-width="3"
              />

              <!-- Texto del componente -->
              <text
                [attr.x]="getSectionX(s.idx)"
                [attr.y]="FaseY[fase]"
                text-anchor="middle"
                dominant-baseline="middle"
                font-size="24"
                font-weight="bold"
                fill="#1e293b"
              >
                {{ s.label }}
              </text>

            }

          }

          <!-- ====== SECCIÓN EN PARALELO (Y) ====== -->
          @if (s.visual === 'paraleloY') {

            <!-- Nodo central -->
            <circle
              [attr.cx]="getSectionX(s.idx)"
              cy="250"
              r="16"
              fill="#111827"
            />

            <!-- Conexiones desde el nodo a cada fase -->
            @for (fase of fases; track fase) {

              <line
                [attr.x1]="getSectionX(s.idx)"
                y1="250"
                [attr.x2]="getSectionX(s.idx)"
                [attr.y2]="FaseY[fase]"
                stroke="#374151"
                stroke-width="5"
                stroke-linecap="round"
              />

            }

            <!-- Componentes intermedios -->
            @for (fase of fases; track fase) {

              <rect
                [attr.x]="getSectionX(s.idx) - 65"
                [attr.y]="(250 + FaseY[fase]) / 2 - 28"
                width="130"
                height="56"
                rx="12"
                ry="12"
                fill="#ffffff"
                stroke="#1e293b"
                stroke-width="3"
              />

              <text
                [attr.x]="getSectionX(s.idx)"
                [attr.y]="(250 + FaseY[fase]) / 2"
                text-anchor="middle"
                dominant-baseline="middle"
                font-size="22"
                font-weight="bold"
                fill="#111827"
              >
                {{ s.label }}
              </text>

            }

          }

          <!-- ====== CONFIGURACIÓN EN DELTA ====== -->
          @if (s.visual === 'paraleloDelta') {

            <!-- Triángulo del sistema delta -->
            <polygon
              [attr.points]="
                (getSectionX(s.idx)) + ',' + FaseY['A'] + ' ' +
                (getSectionX(s.idx) + 130) + ',' + FaseY['B'] + ' ' +
                (getSectionX(s.idx) - 130) + ',' + FaseY['C']
              "
              fill="none"
              stroke="#111827"
              stroke-width="5"
            />

            <!-- ===== FASE A ===== -->
            <rect
              [attr.x]="getSectionX(s.idx) - 55"
              [attr.y]="FaseY['A'] - 32"
              width="110"
              height="64"
              rx="12"
              ry="12"
              fill="#ffffff"
              stroke="#1e293b"
              stroke-width="3"
            />
            <text
              [attr.x]="getSectionX(s.idx)"
              [attr.y]="FaseY['A']"
              text-anchor="middle"
              dominant-baseline="middle"
              font-size="24"
              font-weight="bold"
              fill="#1e293b"
            >
              {{ s.label }}
            </text>

            <!-- ===== FASE B ===== -->
            <rect
              [attr.x]="getSectionX(s.idx) + 65"
              [attr.y]="FaseY['B'] - 32"
              width="110"
              height="64"
              rx="12"
              ry="12"
              fill="#ffffff"
              stroke="#1e293b"
              stroke-width="3"
            />
            <text
              [attr.x]="getSectionX(s.idx) + 120"
              [attr.y]="FaseY['B']"
              text-anchor="middle"
              dominant-baseline="middle"
              font-size="24"
              font-weight="bold"
              fill="#1e293b"
            >
              {{ s.label }}
            </text>

            <!-- ===== FASE C ===== -->
            <rect
              [attr.x]="getSectionX(s.idx) - 175"
              [attr.y]="FaseY['C'] - 32"
              width="110"
              height="64"
              rx="12"
              ry="12"
              fill="#ffffff"
              stroke="#1e293b"
              stroke-width="3"
            />
            <text
              [attr.x]="getSectionX(s.idx) - 120"
              [attr.y]="FaseY['C']"
              text-anchor="middle"
              dominant-baseline="middle"
              font-size="24"
              font-weight="bold"
              fill="#1e293b"
            >
              {{ s.label }}
            </text>

          }

        }

      </svg>

    </div>

  </div>
</div>

}
