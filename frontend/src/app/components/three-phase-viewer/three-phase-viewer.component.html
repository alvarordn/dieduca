@if (data) {
  <div class="circuit-wrapper animate-fadeIn">
    <!-- título del circuito -->
    <div class="circuit-badge">Circuito Trifásico</div>

    <div class="circuit-glass-card">
      <!-- info del circuito -->
      <div class="header">
        <p>f={{ params?.freq }} Hz | V={{ params?.v_line }} V</p>
      </div>

      <div class="svg-container">
        <svg class="circuit-svg" viewBox="0 0 1500 500">

          <!-- estilos del svg -->
          <defs>
            <style>
              .circuit-text {
                font-family: "Plus Jakarta Sans", sans-serif;
                font-weight: bold;
              }

              .component-label {
                font-size: 26px;
                fill: #1e293b;
                stroke: #ffffff;
                stroke-width: 6px;
                paint-order: stroke;
              }
            </style>
          </defs>

          <!-- secciones del circuito -->
          @for (s of sections; track s.idx) {

            <!-- colocación de cada bloque -->
            <svg:g
              [attr.transform]="'translate(' + getSectionX(s.idx) + ', 0)'"
            >

              <!-- modo serie -->
              @if (s.visual === "series") {

                @for (fase of fases; track fase) {

                  <!-- fuente girada -->
                  <g
                    [attr.transform]="
                      'translate(0,' + FaseY[fase] + ') rotate(90)'
                    "
                  >
                    <image
                      [attr.xlink:href]="'assets/components/v_source.png'"
                      x="-60"
                      y="-60"
                      width="120"
                      height="120"
                    />
                  </g>

                  <!-- texto del componente -->
                  <text
                    x="0"
                    [attr.y]="FaseY[fase] - 70"
                    text-anchor="middle"
                    class="circuit-text component-label"
                  >
                    {{ s.label }}
                  </text>
                }
              }

              <!-- modo estrella -->
              @if (s.visual === "paraleloY") {

                @for (fase of fases; track fase) {

                  <!-- línea hacia el componente -->
                  <line
                    x1="0"
                    y1="250"
                    x2="0"
                    [attr.y2]="FaseY[fase]"
                    stroke="#374151"
                    stroke-width="6"
                  />

                  <!-- componente en medio -->
                  <g
                    [attr.transform]="
                      'translate(0,' + (250 + FaseY[fase]) / 2 + ')'
                    "
                  >
                    <image
                      [attr.xlink:href]="'assets/components/inductor.png'"
                      x="-50"
                      y="-50"
                      width="100"
                      height="100"
                    />

                    <!-- etiqueta -->
                    <text
                      x="60"
                      y="-10"
                      dominant-baseline="middle"
                      class="circuit-text component-label"
                      style="text-anchor: start"
                    >
                      {{ s.label }}
                    </text>
                  </g>
                }
              }

              <!-- modo delta -->
              @if (s.visual === "paraleloDelta") {

                <!-- triángulo -->
                <path
                  [attr.d]="
                    'M 0,' +
                    FaseY['A'] +
                    ' L 130,' +
                    FaseY['B'] +
                    ' L -130,' +
                    FaseY['C'] +
                    ' Z'
                  "
                  fill="none"
                  stroke="#111827"
                  stroke-width="6"
                />

                <!-- lado A-B -->
                <g
                  [attr.transform]="
                    'translate(65,' +
                    (FaseY['A'] + FaseY['B']) / 2 +
                    ') rotate(141)'
                  "
                >
                  <image
                    [attr.xlink:href]="'assets/components/resistor.png'"
                    x="-50"
                    y="-50"
                    width="100"
                    height="100"
                  />
                </g>

                <!-- lado B-C -->
                <g
                  [attr.transform]="
                    'translate(0,' +
                    (FaseY['B'] + FaseY['C']) / 2 +
                    ') rotate(58.4)'
                  "
                >
                  <image
                    [attr.xlink:href]="'assets/components/resistor.png'"
                    x="-50"
                    y="-50"
                    width="100"
                    height="100"
                  />
                </g>

                <!-- lado C-A -->
                <g
                  [attr.transform]="
                    'translate(-65,' +
                    (FaseY['C'] + FaseY['A']) / 2 +
                    ') rotate(22.2)'
                  "
                >
                  <image
                    [attr.xlink:href]="'assets/components/resistor.png'"
                    x="-50"
                    y="-50"
                    width="100"
                    height="100"
                  />
                </g>

                <!-- texto del bloque -->
                <text
                  x="20"
                  y="230"
                  text-anchor="middle"
                  class="circuit-text component-label"
                  style="font-size: 32px"
                >
                  {{ s.label }}
                </text>
              }

            </svg:g>
          }

          <!-- líneas principales A B C -->
          @for (fase of fases; track fase) {

            <!-- línea base de cada fase -->
            <line
              x1="50"
              [attr.x2]="getEndX()"
              [attr.y1]="FaseY[fase]"
              [attr.y2]="FaseY[fase]"
              [attr.stroke]="getColor(fase)"
              stroke-width="10"
              stroke-linecap="round"
            />

            <!-- letra de la fase -->
            <text
              x="10"
              [attr.y]="FaseY[fase] + 12"
              [attr.fill]="getColor(fase)"
              font-size="40"
              class="circuit-text"
            >
              {{ fase }}
            </text>
          }

        </svg>
      </div>
    </div>
  </div>
}
