<div class="registro-container">
  <div class="background-overlay"></div>

  <div class="registro-card animate-fadeIn">
    <div class="registro-header">
      <div class="brand-logo">
        <img src="assets/images/logoetsi-removebg-preview.png" alt="ETSI Logo">
      </div>
      <h1>Crear Cuenta</h1>
      <p>Únete a la comunidad de Ingeniería de Sevilla</p>
    </div>

    <form (ngSubmit)="register()" #regForm="ngForm">
      
      <div class="form-group">
        <label for="uvus">Usuario (UVUS) *</label>
        <div class="input-wrapper">
          <i class="bi bi-person-badge"></i>
          <input type="text" id="uvus" [(ngModel)]="uvus" name="uvus" placeholder="Ej: jsmith1" required>
        </div>
        @if (errorUvus) { <div class="error-bubble">{{ errorUvus }}</div> }
      </div>

      <div class="form-group">
        <label for="email">Correo Corporativo *</label>
        <div class="input-wrapper">
          <i class="bi bi-envelope-at"></i>
          <input type="email" id="email" [(ngModel)]="email" name="email" placeholder="usuario@alum.us.es" required>
        </div>
        @if (errorEmail) { <div class="error-bubble">{{ errorEmail }}</div> }
      </div>

      <div class="form-group">
        <label for="grado">Grado Académico *</label>
        <div class="input-wrapper">
          <i class="bi bi-mortarboard"></i>
          <select id="grado" [(ngModel)]="grado" name="grado" required>
            <option value="" disabled selected>Selecciona tu grado</option>
            @for (g of grados; track g.valor) {
              <option [value]="g.valor">{{ g.nombre }}</option>
            }
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Contraseña *</label>
        <div class="input-wrapper">
          <i class="bi bi-key"></i>
          <input type="password" id="password" [(ngModel)]="password" name="password" placeholder="Mín. 8 caracteres" required>
        </div>
        @if (error) { <div class="error-bubble">{{ error }}</div> }
      </div>

      <button type="submit" class="btn-registro" [disabled]="cargando || !regForm.form.valid">
        @if (cargando) {
          <span class="spinner"></span>
          <span>Creando cuenta...</span>
        } @else {
          <span>Registrarse ahora</span>
          <i class="bi bi-check-circle-fill"></i>
        }
      </button>
    </form>

    <div class="login-link">
      <span>¿Ya eres miembro?</span>
      <a [routerLink]="['/login']">Inicia Sesión</a>
    </div>
  </div>
</div>
